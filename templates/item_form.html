{% extends "base.html" %}
{% block title %}List an item — My Block{% endblock %}
{% block content %}
  <h1>List a tool or piece of equipment</h1>
  <form method="post" class="form-card" enctype="multipart/form-data">
    <label>Name
      <input type="text" name="name" placeholder="e.g. Cordless drill" required>
    </label>
    <label>Category
      <select name="category">
        <option>Power tools</option>
        <option>Hand tools</option>
        <option>Yard &amp; garden</option>
        <option>Ladders &amp; access</option>
        <option>Cleaning</option>
        <option>Party &amp; events</option>
        <option>Other</option>
      </select>
    </label>
    <label>Description (optional)
      <textarea name="description" rows="3" placeholder="Anything a borrower should know — condition, accessories included, etc."></textarea>
    </label>
    <label>Photo (optional)
      <input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp">
    </label>
    <button type="submit">List it</button>
  </form>
{% endblock %}
