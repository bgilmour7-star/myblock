<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — My Block</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>🏘️ Join My Block</h1>
    <p class="tagline">You'll need the invite code for your street — ask whoever set this up.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label>Your name
        <input type="text" name="name" placeholder="e.g. Brett" required>
        <span class="field-hint">Shown to neighbours on your listings and the leaderboard.</span>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="field-hint">Used to log in — never shown to other neighbours.</span>
      </label>
      <label>Choose a password
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <label>Street invite code
        <input type="text" name="invite" required>
      </label>
      <button type="submit">Create account</button>
    </form>

    <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
